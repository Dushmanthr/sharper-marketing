# /etc/nginx/sites-available/marketing.sharper-labs.com
# Initial HTTP-only server block. `certbot --nginx` adds the HTTPS server block,
# the certificate paths and the HTTP->HTTPS redirect for you.
# The app container listens on 127.0.0.1:3010 (APP_PORT in /var/www/sharper-marketing/.env).

upstream sharper_marketing_app {
    server 127.0.0.1:3010;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name marketing.sharper-labs.com;

    # Blog image uploads are capped at 10 MB by the app.
    client_max_body_size 12m;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/marketing.sharper-labs.com.access.log;
    error_log  /var/log/nginx/marketing.sharper-labs.com.error.log;

    location / {
        proxy_pass http://sharper_marketing_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
