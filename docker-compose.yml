# Production stack (Hostinger KVM VPS):  docker compose up -d --build
# Reads variables from ./.env (see .env.example).
name: sharper-marketing

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-sharper_marketing}
      MYSQL_USER: ${MYSQL_USER:-sharper}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    # No published ports: the database is only reachable by the app.

  migrate:
    build:
      context: .
      target: migrate
      args: &build_args
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000/}
        NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${NEXT_PUBLIC_EMAILJS_SERVICE_ID:-}
        NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${NEXT_PUBLIC_EMAILJS_TEMPLATE_ID:-}
        NEXT_PUBLIC_EMAILJS_ACK_TEMPLATE_ID: ${NEXT_PUBLIC_EMAILJS_ACK_TEMPLATE_ID:-}
        NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${NEXT_PUBLIC_EMAILJS_PUBLIC_KEY:-}
        NEXT_PUBLIC_SHEETS_WEBAPP_URL: ${NEXT_PUBLIC_SHEETS_WEBAPP_URL:-}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-sharper}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sharper_marketing}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  app:
    build:
      context: .
      target: runner
      args: *build_args
    image: sharper-marketing:latest
    restart: unless-stopped
    ports:
      # Loopback by default; put Caddy/nginx in front for 80/443.
      # Set APP_BIND=0.0.0.0 to expose directly on the VPS IP.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-sharper}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-sharper_marketing}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
      NOREPLY_FROM_EMAIL: ${NOREPLY_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/app/public/uploads
    networks: [internal]
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads:

networks:
  internal:
